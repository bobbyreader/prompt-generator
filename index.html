<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词工坊 — 一句话生成专家级生图提示词</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div class="container">
  <header>
    <h1>提示词工坊</h1>
    <p class="subtitle">一句话想法，AI 生成可直接出图的英文提示词（三个方向）· 满意再一键生图</p>
    <button class="theme-toggle" id="themeToggle" type="button">切换深色</button>
  </header>

  <div class="main-layout">
    <section class="panel" aria-label="输入">
      <h2 class="panel-title">你的想法</h2>
      <label class="label" for="ideaInput">描述你想要的画面（中文即可，越具体越好）</label>
      <textarea id="ideaInput" class="idea-input" rows="4" maxlength="500"
        placeholder="例如：一只橘猫坐在武汉长江大桥上看日落，江面有轮渡，暖色调"></textarea>
      <div class="char-count"><span id="charCount">0</span> / 500</div>

      <span class="label">风格</span>
      <div class="chip-row" id="styleChips" role="radiogroup" aria-label="选择风格">
        <button type="button" class="chip active" data-style="auto">自动</button>
        <button type="button" class="chip" data-style="photography">摄影</button>
        <button type="button" class="chip" data-style="illustration">插画</button>
        <button type="button" class="chip" data-style="anime">动漫</button>
        <button type="button" class="chip" data-style="concept">概念艺术</button>
        <button type="button" class="chip" data-style="3d">3D 渲染</button>
      </div>

      <span class="label">用途</span>
      <div class="chip-row" id="purposeChips" role="radiogroup" aria-label="选择用途">
        <button type="button" class="chip active" data-purpose="通用图片">通用</button>
        <button type="button" class="chip" data-purpose="社媒封面图">社媒封面</button>
        <button type="button" class="chip" data-purpose="海报主视觉">海报</button>
        <button type="button" class="chip" data-purpose="产品商品图">产品图</button>
        <button type="button" class="chip" data-purpose="人像写真">人像</button>
        <button type="button" class="chip" data-purpose="手机壁纸">壁纸</button>
      </div>

      <span class="label">尺寸</span>
      <div class="chip-row" id="sizeChips" role="radiogroup" aria-label="选择尺寸">
        <button type="button" class="chip active" data-size="1024x1024">1:1 方图</button>
        <button type="button" class="chip" data-size="1536x1024">3:2 横图</button>
        <button type="button" class="chip" data-size="1024x1536">2:3 竖图</button>
        <button type="button" class="chip" data-size="1536x864">16:9 横屏</button>
        <button type="button" class="chip" data-size="864x1536">9:16 竖屏</button>
      </div>

      <button class="primary-btn" id="generatePromptBtn" type="button">生成提示词</button>
      <p class="hint" id="promptStatus" role="status"></p>

      <div class="templates">
        <span class="label">没灵感？点一个模板起步</span>
        <div class="chip-row" id="templateChips"></div>
      </div>
    </section>

    <section class="panel" aria-label="结果">
      <h2 class="panel-title">生成的提示词</h2>
      <div class="candidate-tabs" id="candidateTabs" hidden></div>
      <p class="note-zh" id="noteZh"></p>

      <label class="label" for="promptOutput">英文提示词（可直接编辑）</label>
      <textarea id="promptOutput" class="prompt-output" rows="7"
        placeholder="点左侧「生成提示词」，或点一个模板开始"></textarea>

      <label class="label" for="negativeOutput">负面提示词</label>
      <textarea id="negativeOutput" class="prompt-output small" rows="2"
        placeholder="不希望出现的元素"></textarea>

      <div class="action-row">
        <button class="action-btn" id="copyPromptBtn" type="button">复制英文提示词</button>
        <button class="action-btn" id="copyAllBtn" type="button">复制全部（含负面）</button>
        <button class="action-btn" id="favoriteBtn" type="button">收藏</button>
      </div>

      <details class="fields-details" id="fieldsDetails" hidden>
        <summary>结构化字段（点开可逐项修改，会同步回写提示词）</summary>
        <div class="fields-grid" id="fieldsGrid"></div>
      </details>

      <hr class="divider">
      <h3 class="sub-title">用这条提示词生图</h3>
      <button class="primary-btn image-btn" id="generateImageBtn" type="button">生成图片</button>
      <p class="hint" id="imageStatus" role="status"></p>
      <div class="image-error" id="imageError" role="alert"></div>
      <figure class="image-preview" id="imagePreview" hidden>
        <img id="generatedImage" alt="AI 生成的图片">
        <figcaption id="imageMeta"></figcaption>
      </figure>
      <div class="action-row" id="imageActions" hidden>
        <button class="action-btn" id="downloadBtn" type="button">下载图片</button>
        <button class="action-btn" id="regenBtn" type="button">重新生成</button>
      </div>
    </section>
  </div>

  <div class="bottom-layout">
    <section class="panel" aria-label="历史记录">
      <div class="panel-head">
        <h2 class="panel-title">历史记录</h2>
        <button class="text-btn" id="clearHistoryBtn" type="button">清空</button>
      </div>
      <div id="historyList" class="item-list"><div class="empty">暂无记录</div></div>
    </section>
    <section class="panel" aria-label="收藏">
      <div class="panel-head">
        <h2 class="panel-title">我的收藏</h2>
        <button class="text-btn" id="clearFavoritesBtn" type="button">清空</button>
      </div>
      <div id="favoritesList" class="item-list"><div class="empty">暂无收藏</div></div>
    </section>
  </div>

  <footer>提示词由 Agnes 生成 · 生图走 9router（Gemini）· 历史与收藏只存本机浏览器</footer>
</div>
<div class="toast" id="toast"></div>
<script type="module">
  import { init } from './src/app.js';
  init();
</script>
</body>
</html>
